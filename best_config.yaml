models:
  n_dim: 23
  out_dim: 13
  architecture:
    d_model: 128
    n_encoder_layers: 2
    n_decoder_layers: 0
    block_type: simple
    time_adapter: last_token
    in_norm: none
    out_norm: none
    layer_scale: 0
    drop_path: 0.05
    mamba_type: mamba
    mamba_kwargs:
      d_state: 14
      d_conv: 2
      expand: 2
      norm: rms
    cls_kwargs:
      n_heads: 2
      positional_encoding: false
      max_len: 5000
input_len: 16
output_len: 1
batch_size: 256
epochs: 1
seed: 0
dataset:
  path: /media/egghead/Scratch/joey/simulation_data/patient_one_data.zarr/
  training_size: 150000
evaluation:
  path: /media/egghead/Scratch/joey/simulation_data/patient_two_data.zarr/
  evaluation_size: 10
training:
  mode: rollout
  lr: 0.0001
  weight_decay: 0.01
  rollout_steps: 24
checkpoint:
  save_path: hydra-test.pth
  load: false
  path: hydra-test.pth
compile: true
