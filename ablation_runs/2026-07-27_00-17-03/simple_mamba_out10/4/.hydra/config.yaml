models:
  n_dim: 23
  out_dim: 10
  architecture:
    d_model: 128
    n_encoder_layers: 2
    n_decoder_layers: 0
    block_type: simple
    time_adapter: last_token
    in_norm: none
    out_norm: none
    layer_scale: 0.0001
    drop_path: 0.05
    mamba_type: mamba
    mamba_kwargs:
      d_state: 16
      d_conv: 2
      expand: 2
      norm: rms
    skip: false
    cls_kwargs:
      n_heads: 2
      n_mlp: 2
      positional_encoding: false
      max_len: 5000
input_len: 32
output_len: 1
batch_size: 128
epochs: 5
seed: 4
dataset:
  path: /home/jdihardjo/simdata/train.zarr/
  training_size: 1500000
evaluation:
  path: /home/jdihardjo/simdata/evaluation.zarr/
  evaluation_size: 50
training:
  mode: rollout
  lr: 0.0002
  weight_decay: 0.1
  rollout_steps: 16
checkpoint:
  save_path: hydra-test.pth
  load: false
  path: hydra-test.pth
compile: true
