hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ablation_runs/2026-07-23_15-21-30/simple_cls_short_rollout
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra_plugins.hydra_joblib_launcher.joblib_launcher.JoblibLauncher
    n_jobs: 4
    backend: null
    prefer: processes
    require: null
    verbose: 0
    timeout: null
    pre_dispatch: 2*n_jobs
    batch_size: auto
    temp_folder: null
    max_nbytes: null
    mmap_mode: r
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.sweep.dir=ablation_runs/2026-07-23_15-21-30/simple_cls_short_rollout
    - hydra.mode=MULTIRUN
    task:
    - models.architecture.block_type=simple_cls
    - training.mode=rollout
    - training.rollout_steps=4
  job:
    name: trainer
    chdir: null
    override_dirname: models.architecture.block_type=simple_cls,training.mode=rollout,training.rollout_steps=4
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.3
    version_base: '1.3'
    cwd: /home/jdihardjo/Thesis/Thesis-NN
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/jdihardjo/Thesis/Thesis-NN/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      models: rollout
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: joblib
      hydra/output: default
  verbose: false
models:
  n_dim: 23
  out_dim: 10
  architecture:
    d_model: 128
    n_encoder_layers: 2
    n_decoder_layers: 0
    block_type: simple_cls
    time_adapter: last_token
    in_norm: none
    out_norm: none
    layer_scale: 0.0001
    drop_path: 0.05
    mamba_type: mamba
    mamba_kwargs:
      d_state: 16
      d_conv: 2
      expand: 2
      norm: rms
    skip: false
    cls_kwargs:
      n_heads: 2
      n_mlp: 2
      positional_encoding: false
      max_len: 5000
input_len: 32
output_len: 1
batch_size: 128
epochs: 5
seed: 0
dataset:
  path: /home/jdihardjo/simdata/train.zarr/
  training_size: 1500000
evaluation:
  path: /home/jdihardjo/simdata/evaluation.zarr/
  evaluation_size: 50
training:
  mode: rollout
  lr: 0.0002
  weight_decay: 0.1
  rollout_steps: 4
checkpoint:
  save_path: hydra-test.pth
  load: false
  path: hydra-test.pth
compile: true
